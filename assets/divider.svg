<line x1="40" y1="12" x2="960" y2="12" stroke="#B388FF" stroke-opacity=".3"/>
<rect x="40" y="10.5" width="160" height="3" fill="url(#beam)" filter="url(#g1)"><animate attributeName="x" values="40;800;40" dur="5s" repeatCount="indefinite"/></rect>
<g transform="translate(500 12)" fill="none" stroke="#FF4FD8" filter="url(#g1)"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)"><animateTransform attributeName="transform" type="rotate" values="45;405" dur="8s" repeatCount="indefinite"/></rect></g>
