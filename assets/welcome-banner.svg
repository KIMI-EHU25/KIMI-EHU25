<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0F1225"/><stop offset="1" stop-color="#151A33"/>
  </linearGradient>
  <radialGradient id="a"><stop offset="0" stop-color="#5B8CFF" stop-opacity=".55"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="b"><stop offset="0" stop-color="#A78BFA" stop-opacity=".5"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <radialGradient id="c"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".4"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E0E7FF"/>
    <stop offset=".5" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#C4B5FD"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="10" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1000" height="240" rx="18"/></clipPath>
  <mask id="tm">
    <text x="500" y="112" text-anchor="middle" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="300" letter-spacing="4" fill="#fff">Hello, welcome to visit</text>
  </mask>
  <clipPath id="c0"><rect x="335.0" y="150" height="40" width="0"><animate attributeName="width" values="0.0;330.0;330.0;0.0;0.0" keyTimes="0.0000;0.1000;0.1875;0.2250;1.0000" dur="16.0s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c1"><rect x="302.0" y="150" height="40" width="0"><animate attributeName="width" values="0.0;0.0;396.0;396.0;0.0;0.0" keyTimes="0.0000;0.2500;0.3500;0.4375;0.4750;1.0000" dur="16.0s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c2"><rect x="222.8" y="150" height="40" width="0"><animate attributeName="width" values="0.0;0.0;554.4;554.4;0.0;0.0" keyTimes="0.0000;0.5000;0.6000;0.6875;0.7250;1.0000" dur="16.0s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c3"><rect x="321.8" y="150" height="40" width="0"><animate attributeName="width" values="0.0;0.0;356.4;356.4;0.0;0.0" keyTimes="0.0000;0.7500;0.8500;0.9375;0.9750;1.0000" dur="16.0s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="240" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="220" cy="110" r="160" fill="url(#a)"><animateTransform attributeName="transform" type="translate" values="0 0;140 -20;0 0" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="90" r="170" fill="url(#b)"><animateTransform attributeName="transform" type="translate" values="0 0;-160 30;0 0" dur="20s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="230" r="150" fill="url(#c)"><animateTransform attributeName="transform" type="translate" values="0 0;60 -50;0 0" dur="16s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <text x="500" y="112" text-anchor="middle" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="300" letter-spacing="4" fill="url(#txt)" filter="url(#soft)">Hello, welcome to visit</text>
    <rect x="-260" y="44" width="200" height="100" fill="url(#shine)" mask="url(#tm)" opacity=".6">
      <animate attributeName="x" values="-260;1100;1100" keyTimes="0;.6;1" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="500" y="178" text-anchor="middle" clip-path="url(#c0)" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="22" fill="#A5B4FC">UCI Undergraduate Student</text>
  <rect y="158" width="2" height="26" fill="#C4B5FD" opacity="0"><animate attributeName="x" values="335.0;665.0;665.0;335.0;335.0" keyTimes="0.0000;0.1000;0.1875;0.2250;1.0000" dur="16.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.2375;1.0000" calcMode="discrete" dur="16.0s" repeatCount="indefinite"/></rect>
  <text x="500" y="178" text-anchor="middle" clip-path="url(#c1)" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="22" fill="#A5B4FC">Backend &amp; Full-Stack Developer</text>
  <rect y="158" width="2" height="26" fill="#C4B5FD" opacity="0"><animate attributeName="x" values="302.0;302.0;698.0;698.0;302.0;302.0" keyTimes="0.0000;0.2500;0.3500;0.4375;0.4750;1.0000" dur="16.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.0000;0.2500;0.4875;1.0000" calcMode="discrete" dur="16.0s" repeatCount="indefinite"/></rect>
  <text x="500" y="178" text-anchor="middle" clip-path="url(#c2)" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="22" fill="#A5B4FC">Python | FastAPI | PostgreSQL | JavaScript</text>
  <rect y="158" width="2" height="26" fill="#C4B5FD" opacity="0"><animate attributeName="x" values="222.8;222.8;777.2;777.2;222.8;222.8" keyTimes="0.0000;0.5000;0.6000;0.6875;0.7250;1.0000" dur="16.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.0000;0.5000;0.7375;1.0000" calcMode="discrete" dur="16.0s" repeatCount="indefinite"/></rect>
  <text x="500" y="178" text-anchor="middle" clip-path="url(#c3)" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="22" fill="#A5B4FC">I automate the boring stuff</text>
  <rect y="158" width="2" height="26" fill="#C4B5FD" opacity="0"><animate attributeName="x" values="321.8;321.8;678.2;678.2;321.8;321.8" keyTimes="0.0000;0.7500;0.8500;0.9375;0.9750;1.0000" dur="16.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0.0000;0.7500;0.9875;1.0000" calcMode="discrete" dur="16.0s" repeatCount="indefinite"/></rect>
</g>
</svg>
