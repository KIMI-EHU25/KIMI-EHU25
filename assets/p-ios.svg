<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 200" width="490" height="200">
<defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF4FD8"><animate attributeName="stop-color" values="#FF4FD8;#7DF9FF;#B388FF;#FF4FD8" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset=".5" stop-color="#B388FF"><animate attributeName="stop-color" values="#B388FF;#FF4FD8;#7DF9FF;#B388FF" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#7DF9FF"><animate attributeName="stop-color" values="#7DF9FF;#B388FF;#FF4FD8;#7DF9FF" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="g1" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="g2" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DF9FF" stop-opacity="0"/><stop offset=".5" stop-color="#7DF9FF" stop-opacity=".95"/><stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070316"/><stop offset="1" stop-color="#150833"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7DF9FF" stroke-opacity=".06"/></pattern>
  
  <clipPath id="clip"><rect width="490" height="200" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="490" height="200" fill="url(#bg)"/><rect width="490" height="200" fill="url(#grid)"/>
  <ellipse cx="430" cy="20" rx="170" ry="80" fill="#B388FF" fill-opacity=".12"><animate attributeName="fill-opacity" values=".06;.2;.06" dur="4s" repeatCount="indefinite"/></ellipse>
  <g transform="translate(48 50)">
      <circle r="26" fill="#B388FF" fill-opacity=".12" stroke="#B388FF" stroke-opacity=".7"/>
      <circle r="26" fill="none" stroke="#B388FF" stroke-dasharray="5 9" filter="url(#g1)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></circle>
      <text y="9" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="22" font-weight="700" fill="#B388FF" filter="url(#g1)">*</text></g><text x="92" y="64" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">Minesweeper for iPhone</text><text x="28" y="112" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12.5" fill="#B9C0E6">Classic Minesweeper rebuilt as</text><text x="28" y="130" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12.5" fill="#B9C0E6">a native iOS app</text><rect x="28" y="158" width="55.0" height="24" rx="12" fill="#B388FF" fill-opacity=".14" stroke="#B388FF" stroke-opacity=".7"/><text x="55.5" y="174" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12" fill="#B388FF">Swift</text>
  <g font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11" letter-spacing="2" fill="#B388FF"><text x="466" y="28" text-anchor="end">iOS</text></g>
  <text x="466" y="176" text-anchor="end" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" fill="#7DF9FF" filter="url(#g1)">VIEW REPO<tspan>&#160;</tspan><tspan>&#8594;<animate attributeName="dx" values="0;5;0" dur="1.2s" repeatCount="indefinite"/></tspan></text>
  <rect width="490" height="26" fill="url(#beam)" opacity=".07"><animate attributeName="y" values="-30;200" dur="4.5s" repeatCount="indefinite"/></rect>
</g><rect x="1.5" y="1.5" width="487" height="197" rx="15" fill="none" stroke="url(#neon)" stroke-width="2.5" stroke-dasharray="260 120" filter="url(#g1)"><animate attributeName="stroke-dashoffset" values="0;-1380" dur="7s" repeatCount="indefinite"/></rect><rect x="1" y="1" width="488" height="198" rx="15" fill="none" stroke="#7DF9FF" stroke-opacity=".12"/>
</svg>