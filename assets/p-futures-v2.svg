  <ellipse cx="430" cy="20" rx="170" ry="80" fill="#FF4FD8" fill-opacity=".12"><animate attributeName="fill-opacity" values=".06;.2;.06" dur="4s" repeatCount="indefinite"/></ellipse>
  <g transform="translate(48 50)">
