      <text y="9" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="22" font-weight="700" fill="#FF4FD8" filter="url(#g1)">&#8734;</text></g><text x="92" y="46" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="800" fill="#fff">After-Hours Futures Account</text><text x="92" y="70" font-family="-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="800" fill="#fff">Opening Automation System</text><text x="28" y="112" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12.5" fill="#B9C0E6">Collect an applicant's data once, then</text><text x="28" y="130" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12.5" fill="#B9C0E6">pre-fill the official futures site through</text><text x="28" y="148" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12.5" fill="#B9C0E6">a WebView DOM / Vue injection engine</text><rect x="28" y="158" width="69.8" height="24" rx="12" fill="#FF4FD8" fill-opacity=".14" stroke="#FF4FD8" stroke-opacity=".7"/><text x="62.9" y="174" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12" fill="#FF4FD8">FastAPI</text><rect x="105.80000000000001" y="158" width="92.0" height="24" rx="12" fill="#FF4FD8" fill-opacity=".14" stroke="#FF4FD8" stroke-opacity=".7"/><text x="151.8" y="174" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12" fill="#FF4FD8">PostgreSQL</text><rect x="205.8" y="158" width="40.2" height="24" rx="12" fill="#FF4FD8" fill-opacity=".14" stroke="#FF4FD8" stroke-opacity=".7"/><text x="225.9" y="174" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12" fill="#FF4FD8">JWT</text><rect x="254.0" y="158" width="92.0" height="24" rx="12" fill="#FF4FD8" fill-opacity=".14" stroke="#FF4FD8" stroke-opacity=".7"/><text x="300.0" y="174" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12" fill="#FF4FD8">Vanilla JS</text>
  <g font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11" letter-spacing="2" fill="#FF4FD8"><text x="466" y="28" text-anchor="end">FEATURED</text></g>
  <text x="466" y="176" text-anchor="end" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" fill="#7DF9FF" filter="url(#g1)">VIEW REPO<tspan>&#160;</tspan><tspan>&#8594;<animate attributeName="dx" values="0;5;0" dur="1.2s" repeatCount="indefinite"/></tspan></text>
