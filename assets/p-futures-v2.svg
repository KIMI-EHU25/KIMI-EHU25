    <stop offset=".5" stop-color="#B388FF"><animate attributeName="stop-color" values="#B388FF;#FF4FD8;#7DF9FF;#B388FF" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#7DF9FF"><animate attributeName="stop-color" values="#7DF9FF;#B388FF;#FF4FD8;#7DF9FF" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="g1" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="g2" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DF9FF" stop-opacity="0"/><stop offset=".5" stop-color="#7DF9FF" stop-opacity=".95"/><stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070316"/><stop offset="1" stop-color="#150833"/></linearGradient>
